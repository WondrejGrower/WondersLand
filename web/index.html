<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101b1b"><meta name="description" content="WondersLand [WL] — a living Bitcoin forest. Explore, jump over real transactions and build your camp."><title>WondersLand [WL]</title><link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/icons/icon-180.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="WondersLand"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"></head><body data-ready="false">
<header>
  <div class="brand"><img src="/icons/icon-192.png" alt="" width="32" height="32"><strong>WondersLand <span>[WL]</span></strong></div>
  <span id="wallet"></span>
  <button id="header-toggle" type="button" aria-expanded="false" aria-controls="header-actions">Menu</button>
  <div id="header-actions">
    <div class="game-actions">
      <button id="inventory" hidden type="button">Inventory</button>
      <button id="verified" hidden type="button">Verified runs</button>
      <button id="leaderboard" type="button">Leaderboard</button>
      <button id="account" type="button" hidden>Nostr account</button>
      <button id="settings" type="button">Settings</button>
    </div>
    <div class="utilities">
      <button id="fullscreen" type="button">Fullscreen</button>
      <button id="help" type="button" aria-label="A small field guide"><span aria-hidden="true">?</span><span class="help-label">A small field guide</span></button>
    </div>
  </div>
</header>
<button id="leave-fullscreen" hidden type="button">Exit fullscreen</button><main id="world"><div id="stage"><canvas id="scene" tabindex="0" width="640" height="360" aria-label="WondersLand forest"></canvas><div id="hud" aria-live="off"></div><div id="stations"></div><div id="touch-controls" hidden><button id="touch-pause" type="button">Pause</button><button id="touch-fly" type="button" hidden>Fly</button><button id="touch-jump" type="button">Jump</button></div><button id="camp-gate" hidden type="button">Walk to gate →</button><button id="interact" hidden></button></div><section id="sheet" hidden aria-label="Game menu"><div id="menu" role="dialog" aria-modal="true"></div></section></main>
<footer><span id="connection" role="status">Connecting…</span><span id="keys">WASD / arrows · E · Esc</span></footer><div id="error" role="alert" hidden></div><input id="import" type="file" accept="application/json,.json" hidden>
<script type="module" src="./app.mjs"></script></body></html>
