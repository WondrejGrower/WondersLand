name: Browser checks
on:
  push:
    branches: [main, game/roguelite-0.3]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:jump-input
      - run: npm run test:mobile
      - run: npm run test:pwa
      - run: npm run test:admin
      - run: npm run test:verified
      - run: npm run test:monthly
      - run: npm run test:results
      - run: npm run test:roles
      - run: npm run test:input-feed
      - run: npm run test:inventory
      - run: npm run test:environment
      - run: npm run deploy:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wondersland-browser
          path: dist
