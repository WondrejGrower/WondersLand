name: Browser checks
on:
  push:
    branches: [main, game/roguelite-0.3]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:jump-input
      - run: npm run test:monthly
      - run: npm run test:results
      - run: npm run test:roles
      - run: npm run test:input-feed
      - run: npm run test:inventory
      - run: npm run test:environment
      - run: npm run deploy:check
      - uses: actions/upload-artifact@v4
        with:
          name: wondersland-browser
          path: dist
